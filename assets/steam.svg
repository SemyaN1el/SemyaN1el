<svg
    width="520"
    height="200"
    viewBox="0 0 520 200"
    xmlns="http://www.w3.org/2000/svg"
>
    <style>
        .title {
            font-family: -apple-system, BlinkMacSystemFont,
                         "Segoe UI", Helvetica, Arial, sans-serif;
            font-size: 21px;
            font-weight: 600;
            fill: #f0f6fc;
        }

        .big {
            font-family: -apple-system, BlinkMacSystemFont,
                         "Segoe UI", Helvetica, Arial, sans-serif;
            font-size: 28px;
            font-weight: 700;
            fill: #f0f6fc;
        }

        .label {
            font-family: -apple-system, BlinkMacSystemFont,
                         "Segoe UI", Helvetica, Arial, sans-serif;
            font-size: 13px;
            font-weight: 500;
            fill: #8b949e;
        }

        .value {
            font-family: -apple-system, BlinkMacSystemFont,
                         "Segoe UI", Helvetica, Arial, sans-serif;
            font-size: 14px;
            font-weight: 600;
            fill: #f0f6fc;
        }

        .footer {
            font-family: -apple-system, BlinkMacSystemFont,
                         "Segoe UI", Helvetica, Arial, sans-serif;
            font-size: 10px;
            fill: #484f58;
        }
    </style>

    <!-- Background -->

    <rect
        x="0.5"
        y="0.5"
        width="519"
        height="199"
        rx="8"
        fill="#000000"
        stroke="#30363d"
    />

    <!-- Header -->

    <text
        x="24"
        y="35"
        class="title"
    >
        Steam Stats
    </text>

    <text
        x="496"
        y="34"
        text-anchor="end"
        class="label"
    >
        Online
    </text>

    <!-- Level -->

    <text
        x="24"
        y="82"
        class="big"
    >
        63
    </text>

    <text
        x="24"
        y="102"
        class="label"
    >
        Level
    </text>

    <!-- Games -->

    <text
        x="135"
        y="82"
        class="big"
    >
        174
    </text>

    <text
        x="135"
        y="102"
        class="label"
    >
        Games
    </text>

    <!-- Achievements -->

    <text
        x="275"
        y="82"
        class="big"
    >
        4,256
    </text>

    <text
        x="275"
        y="102"
        class="label"
    >
        Achievements
    </text>

    <!-- Stats row -->

    <circle
        cx="27"
        cy="136"
        r="4"
        fill="#66c0f4"
    />

    <text
        x="39"
        y="141"
        class="label"
    >
        Badges
    </text>

    <text
        x="92"
        y="141"
        class="value"
    >
        57
    </text>


    <circle
        cx="145"
        cy="136"
        r="4"
        fill="#66c0f4"
    />

    <text
        x="157"
        y="141"
        class="label"
    >
        Perfect
    </text>

    <text
        x="211"
        y="141"
        class="value"
    >
        22
    </text>


    <circle
        cx="266"
        cy="136"
        r="4"
        fill="#66c0f4"
    />

    <text
        x="278"
        y="141"
        class="label"
    >
        Completion
    </text>

    <text
        x="351"
        y="141"
        class="value"
    >
        47%
    </text>


    <circle
        cx="404"
        cy="136"
        r="4"
        fill="#66c0f4"
    />

    <text
        x="416"
        y="141"
        class="label"
    >
        2 weeks
    </text>

    <text
        x="467"
        y="141"
        class="value"
    >
        11.1h
    </text>

    <!-- Footer -->

    <text
        x="24"
        y="179"
        class="footer"
    >
        Updated automatically
    </text>

    <text
        x="496"
        y="179"
        text-anchor="end"
        class="footer"
    >
        2026-08-18 13:07 UTC
    </text>
</svg>